name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.96.0", "stable"]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Toolchain versions
        run: |
          rustc +${{ matrix.toolchain }} -Vv
          cargo +${{ matrix.toolchain }} -V
          cargo +${{ matrix.toolchain }} clippy --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.toolchain }}
      - name: fmt
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: clippy
        run: cargo +${{ matrix.toolchain }} clippy --locked --workspace --all-targets -- -D warnings
      - name: test
        run: cargo +${{ matrix.toolchain }} test --locked --workspace
