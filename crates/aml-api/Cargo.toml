[package]
name = "aml-api"
description = "Axum HTTP API for ZKP AML PoC"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aml-api"
path = "src/main.rs"

[lib]
name = "aml_api"
path = "src/lib.rs"

[dependencies]
aml-core = { workspace = true }
aml-protocol = { workspace = true }
aml-crypto-ibc = { workspace = true }
aml-crypto-window = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
sha3 = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true }
