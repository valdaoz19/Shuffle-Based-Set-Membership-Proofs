[workspace]
resolver = "2"
members = [
    "crates/smp-primitives",
    "crates/smp-vc",
    "crates/smp-e1",
    "crates/aml-core",
    "crates/aml-crypto-ibc",
    "crates/aml-persephone",
    "crates/aml-crypto-shuffle",
    "crates/aml-crypto-membership",
    "crates/aml-crypto-window",
    "crates/aml-crypto-update",
    "crates/aml-protocol",
    "crates/aml-api",
    "crates/aml-bench",
    "crates/aml-three",
    "crates/aml-wallet",
    "crates/aml-alipay",
    "crates/aml-paypay",
    "crates/aml-metrics",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["ZKP AML PoC"]

[workspace.dependencies]
smp-primitives = { path = "crates/smp-primitives" }
smp-vc = { path = "crates/smp-vc" }
ark-bls12-381 = { version = "0.4", default-features = false, features = ["curve", "std"] }
ark-ec = { version = "0.4", default-features = false, features = ["std"] }
ark-ff = { version = "0.4", default-features = false, features = ["std"] }
ark-serialize = { version = "0.4", default-features = false, features = ["std", "derive"] }
sha2 = "0.10"
aml-core = { path = "crates/aml-core" }
aml-crypto-ibc = { path = "crates/aml-crypto-ibc" }
aml-persephone = { path = "crates/aml-persephone" }
aml-crypto-shuffle = { path = "crates/aml-crypto-shuffle" }
aml-crypto-membership = { path = "crates/aml-crypto-membership" }
aml-crypto-window = { path = "crates/aml-crypto-window" }
aml-crypto-update = { path = "crates/aml-crypto-update" }
aml-protocol = { path = "crates/aml-protocol" }
aml-three = { path = "crates/aml-three" }
aml-metrics = { path = "crates/aml-metrics" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
rand_core = "0.6"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
curve25519-dalek = { version = "4.1.3", features = ["rand_core", "serde", "digest"] }
sha3 = "0.10"
rust_xlsxwriter = "0.82"
num-bigint = "0.4"
merlin = "3"
cklr_service = { git = "https://github.com/ant-dtc/persephone-service", rev = "65c53c6d0f3253aee0347e46ea6dde4807421b97" }
criterion = { version = "0.5", features = ["html_reports"] }
